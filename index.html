    <div id="dl" class="diceLayer"></div>

        <h2 id="counterTitle">特殊カウンター</h2>
        <div id="counterPlayer" class="counterPlayer"></div>
        <div class="counterGrid">
          <div class="specialCounterCard poison">
            <div class="specialCounterLabel">
              <svg class="counterIcon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-80v-170q-39-17-68.5-45.5t-50-64.5q-20.5-36-31-77T80-520q0-158 112-259t288-101q176 0 288 101t112 259q0 42-10.5 83t-31 77q-20.5 36-50 64.5T720-250v170H240Zm80-80h40v-80h80v80h80v-80h80v80h40v-142q38-9 67.5-30t50-50q20.5-29 31.5-64t11-74q0-125-88.5-202.5T480-800q-143 0-231.5 77.5T160-520q0 39 11 74t31.5 64q20.5 29 50.5 50t67 30v142Zm100-200h120l-60-120-60 120Zm-80-80q33 0 56.5-23.5T420-520q0-33-23.5-56.5T340-600q-33 0-56.5 23.5T260-520q0 33 23.5 56.5T340-440Zm280 0q33 0 56.5-23.5T700-520q0-33-23.5-56.5T620-600q-33 0-56.5 23.5T540-520q0 33 23.5 56.5T620-440Z"/></svg>

            </div>
            <div class="specialCounterControls">
              <button type="button" data-counter-minus="poison" aria-label="毒カウンターを1減らす">−1</button>
              <input id="poisonInput" class="counterInput" type="number" min="0" step="1" inputmode="numeric" aria-label="毒カウンター">
              <button type="button" data-counter-plus="poison" aria-label="毒カウンターを1増やす">＋1</button>
            </div>
            <div class="counterHint">10個で敗北</div>
          </div>

          <div class="specialCounterCard experience">
            <div class="specialCounterLabel">
              <svg class="counterIcon" viewBox="0 -960 960 960" aria-hidden="true"><path d="m480-174-74 56q-12 9-24 .5t-7-22.5l29-92-73-52q-12-8-7-22t19-14h89l28-92-142-84q-18-11-28-29t-10-41v-234q0-33 23.5-56.5T360-880h240q33 0 56.5 23.5T680-800v234q0 23-10 41t-28 29l-142 84 28 92h89q14 0 19 14t-7 22l-73 52 29 92q5 14-7 22.5t-24-.5l-74-56ZM360-800v234l80 48v-282h-80Zm240 0h-80v282l80-48v-234Z"/></svg>

              <input id="experienceInput" class="counterInput" type="number" min="0" step="1" inputmode="numeric" aria-label="経験カウンター">
              <button type="button" data-counter-plus="experience" aria-label="経験カウンターを1増やす">＋1</button>
            </div>
            <div class="counterHint">プレイヤーに蓄積</div>
          </div>

            <div class="specialCounterLabel">
              <svg class="counterIcon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M418-340q24 24 62 23.5t56-27.5l169-253q9-14-2.5-25.5T677-625L424-456q-27 18-28.5 55t22.5 61Zm62-460q36 0 71 6t68 19q16 6 34 22.5t10 31.5q-8 15-36 20t-45-1q-25-9-50.5-13.5T480-720q-133 0-226.5 93.5T160-400q0 42 11.5 83t32.5 77h552q23-38 33.5-79t10.5-85q0-26-4.5-51T782-504q-6-17-2-33t18-27q13-10 28.5-6t21.5 18q15 35 23 71.5t9 74.5q1 57-13 109t-41 99q-11 18-30 28t-40 10H204q-21 0-40-10t-30-28q-26-45-40-95.5T80-400q0-83 31.5-155.5t86-127Q252-737 325-768.5T480-800Z"/></svg>

            </div>
            <div class="specialCounterControls">
              <button type="button" data-counter-minus="speed" aria-label="速度を1減らす">−1</button>
              <input id="speedInput" class="counterInput" type="number" min="0" max="4" step="1" inputmode="numeric" aria-label="速度">
              <button type="button" data-counter-plus="speed" aria-label="速度を1増やす">＋1</button>
            </div>
            <div class="counterHint">最大4</div>
          </div>
        </div>
        <div class="acts"><button type="button" id="counterClose">閉じる</button></div>
      </div>
    </div>

    <div id="settings" class="ov">
      <div class="modal">
        <h2>ゲーム設定</h2>
        <div class="row">
          <b>人数</b>
          <div>
            <button type="button" data-count="2">2人</button>
            <button type="button" data-count="3">3人</button>
            <button type="button" data-count="4">4人</button>
          </div>
        </div>
        <div id="ps"></div>
        <div class="row">
          <b>ゲーム</b>
          <div><button type="button" id="reset">全リセット</button></div>
        </div>
        <div class="acts"><button type="button" id="close">閉じる</button></div>
      </div>
    </div>
  </div>
