<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EDH Life">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>EDH Life Counter</title>
<style>
:root{--bg:#0d0f14;--line:#ffffff22;--txt:#f7f8fb;--mut:#aab2c2;--danger:#ff656d;--warn:#ffcc66;--app-w:100dvw;--app-h:100dvh}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit}button{color:inherit;touch-action:manipulation}
#app{position:fixed;left:0;top:0;width:var(--app-w);height:var(--app-h);display:grid;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
#app.c4{grid-template:1fr 1fr/1fr 1fr}#app.c3{grid-template:1fr 1fr/1fr 1fr}#app.c2{grid-template:1fr 1fr/1fr}.c3 .p:nth-child(1){grid-column:1/3}
.p{--pc:#666;position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid #0006;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 24%,#171b24),#11141b 76%)}.p.hide{display:none}
.pc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 8px;transform-origin:center;overflow:hidden}.pc>*{flex-shrink:0}
.c4 .p:nth-child(1) .pc,.c4 .p:nth-child(2) .pc,.c3 .p:nth-child(1) .pc,.c2 .p:nth-child(1) .pc{transform:rotate(180deg)}
.name{max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(13px,1.8vw,18px);font-weight:900;line-height:1.05}
.lifeRow{display:grid;grid-template-columns:66px minmax(90px,1fr) 66px;align-items:center;gap:8px;width:min(94%,540px)}
.life{border:0;background:transparent;font-size:clamp(62px,15vmin,126px);font-weight:950;line-height:.82;letter-spacing:-.05em;padding:0 5px 3px;border-radius:18px;text-shadow:0 6px 18px #0006}
.delta{height:68px;border-radius:18px;border:1px solid var(--line);background:#ffffff12;font-size:34px;font-weight:950}.delta:active,.q button:active,.cmd button:active{transform:scale(.96);background:#ffffff20}
.q{display:flex;gap:6px;width:min(94%,520px)}.q button{flex:1;min-width:0;padding:5px 4px;border:1px solid var(--line);border-radius:11px;background:#07090d7a;font-weight:900}
.cmd{width:min(94%,540px);border:1px solid var(--line);background:#07090d6b;border-radius:13px;padding:6px}.ct{font-size:9px;text-align:center;color:var(--mut);font-weight:900;letter-spacing:.08em;margin-bottom:4px}.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.cc{--c:#888;min-width:0;border:1px solid color-mix(in srgb,var(--c) 48%,#ffffff22);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 13%,#141821),#10131a);border-radius:10px;padding:4px;text-align:center}.cw{font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cv{font-size:22px;font-weight:950;line-height:1;margin:2px 0 3px}.cc.hot .cv{color:var(--danger)}.cb{display:grid;grid-template-columns:1fr 1fr;gap:4px}.cb button{min-height:26px;border-radius:8px;border:1px solid var(--line);background:#ffffff12;font-weight:900}
.dead{position:absolute;left:8px;bottom:5px;font-size:10px;font-weight:900;color:var(--danger)}
#tools{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}#tools>button,.dw>button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#111620ed;box-shadow:0 5px 16px #0005;font-size:18px;font-weight:900}.dw{position:relative}.dm{position:absolute;right:48px;top:0;display:none;gap:6px;padding:6px;border:1px solid var(--line);background:#111620f2;border-radius:12px}.dm.show{display:flex}.dm button{min-width:58px;height:38px;border-radius:10px;border:1px solid var(--line);background:#202633;font-weight:900}
.ov{position:fixed;inset:0;background:#040609d1;backdrop-filter:blur(8px);display:none;z-index:40;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px))}.ov.show{display:flex}.modal{width:min(620px,96vw);max-height:92dvh;overflow:auto;background:#151923;border:1px solid var(--line);border-radius:22px;padding:16px}.modal h2{margin:0 0 8px}.row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff12}.row input[type=text]{width:100%;background:#0f131a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;-webkit-user-select:text;user-select:text}.row input[type=color]{width:54px;height:34px;border:0;background:transparent}.modal button{min-height:40px;border-radius:11px;border:1px solid var(--line);background:#202633;padding:8px 12px;font-weight:900}.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.diceLayer{position:fixed;inset:0;pointer-events:none;z-index:30}.die{position:absolute;width:108px;height:108px;border-radius:22px;border:3px solid #ffffffc7;background:linear-gradient(145deg,#fff,#d8dde6);box-shadow:0 18px 42px #0007;display:flex;align-items:center;justify-content:center;animation:roll .8s cubic-bezier(.18,.78,.26,1.18)}.die.center{left:50%;top:50%}.die.player{left:50%;top:48%;width:94px;height:94px}.face{width:72%;height:72%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);align-items:center;justify-items:center}.pip{width:16px;height:16px;border-radius:50%;background:#11151c;opacity:0}.die.player .pip{width:14px;height:14px}.face[data-v="1"] .p5,.face[data-v="2"] .p1,.face[data-v="2"] .p9,.face[data-v="3"] .p1,.face[data-v="3"] .p5,.face[data-v="3"] .p9,.face[data-v="4"] .p1,.face[data-v="4"] .p3,.face[data-v="4"] .p7,.face[data-v="4"] .p9,.face[data-v="5"] .p1,.face[data-v="5"] .p3,.face[data-v="5"] .p5,.face[data-v="5"] .p7,.face[data-v="5"] .p9,.face[data-v="6"] .p1,.face[data-v="6"] .p3,.face[data-v="6"] .p4,.face[data-v="6"] .p6,.face[data-v="6"] .p7,.face[data-v="6"] .p9{opacity:1}.face[data-v="1"] .p5{background:#d32f2f}.rolling .face{animation:jitter .12s steps(2,end) infinite}@keyframes jitter{50%{transform:translate(2px,-1px) rotate(2deg)}}@keyframes roll{0%{opacity:0;transform:translate(-50%,-50%) translate(var(--x0,-80px),var(--y0,-45px)) rotate(-300deg) scale(.6,.82)}25%{opacity:1;transform:translate(-50%,-50%) translate(var(--x1,55px),var(--y1,-25px)) rotate(-80deg) scale(1.08,.94)}50%{transform:translate(-50%,-50%) translate(var(--x2,-30px),var(--y2,12px)) rotate(130deg) scale(.93,1.06)}75%{transform:translate(-50%,-50%) translate(var(--x3,16px),var(--y3,-6px)) rotate(280deg) scale(1.04,.97)}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}}
@media(orientation:landscape){#tools{left:50%;right:auto;top:50%;transform:translate(-50%,-50%);flex-direction:row;gap:4px}.dw{position:relative}.dm{right:auto;left:50%;top:auto;bottom:46px;transform:translateX(-50%)}}
@media(max-width:720px){#tools>button,.dw>button{width:36px;height:36px}.lifeRow{grid-template-columns:52px minmax(72px,1fr) 52px}.delta{height:54px;font-size:29px}.die.center{width:92px;height:92px}.die.player{width:78px;height:78px}.pip{width:13px;height:13px}.die.player .pip{width:11px;height:11px}}
@media(orientation:landscape) and (max-height:520px){.pc{gap:3px;padding:4px 7px}.name{font-size:12px;line-height:1}.lifeRow{grid-template-columns:52px minmax(64px,1fr) 52px;gap:5px;width:min(92%,520px)}.life{font-size:clamp(46px,13vmin,66px);line-height:.78;padding-bottom:0}.delta{height:50px;font-size:28px;border-radius:14px}.q{gap:4px;width:min(92%,510px)}.q button{padding:3px 2px;font-size:11px;line-height:1.15}.cmd{width:min(92%,520px);padding:3px;border-radius:9px}.ct{font-size:7px;margin-bottom:2px}.cg{gap:3px}.cc{padding:2px;border-radius:8px}.cw{font-size:8px;line-height:1}.cv{font-size:16px;line-height:1;margin:1px 0 2px}.cb{gap:2px}.cb button{min-height:20px;font-size:10px;padding:0}.dead{font-size:8px;bottom:2px}#tools>button,.dw>button{width:34px;height:34px;border-radius:10px;font-size:15px}.dm{bottom:40px}.dm button{height:32px;min-width:50px;font-size:11px}}
@media(orientation:landscape) and (max-height:440px){.pc{gap:2px;padding:3px 6px}.name{font-size:11px}.lifeRow{grid-template-columns:48px minmax(58px,1fr) 48px}.life{font-size:52px}.delta{height:46px;font-size:26px}.q button{font-size:10px;padding:2px}.cmd{padding:2px}.ct{font-size:6.5px}.cw{font-size:7.5px}.cv{font-size:15px}.cb button{min-height:19px;font-size:9.5px}}
@media(display-mode:standalone){#fs{display:none!important}}
</style>
</head>
<body>
<div id="app" class="c4"></div>
<div id="tools"><button id="undo" title="Undo">↶</button><div class="dw"><button id="dice" title="ダイス">🎲</button><div id="dm" class="dm"><button id="one">1個</button><button id="all">全員</button></div></div><button id="fs" title="フルスクリーン">⛶</button><button id="set" title="設定">⚙</button></div>
<div id="dl" class="diceLayer"></div>
<div id="settings" class="ov"><div class="modal"><h2>ゲーム設定</h2><div class="row"><b>人数</b><div><button data-count="2">2人</button> <button data-count="3">3人</button> <button data-count="4">4人</button></div></div><div id="ps"></div><div class="row"><b>ゲーム</b><div><button id="reset">全リセット</button></div></div><div class="acts"><button id="close">閉じる</button></div></div></div>
<script>
const D=[['Player 1','#d35a5a'],['Player 2','#4d79d8'],['Player 3','#4da66a'],['Player 4','#c2923f']];
let S=load()||{count:4,players:D.map(x=>({name:x[0],color:x[1],life:40,cmd:[0,0,0,0]})),hist:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function syncViewport(){const v=window.visualViewport;const w=Math.round(v?v.width:window.innerWidth),h=Math.round(v?v.height:window.innerHeight);document.documentElement.style.setProperty('--app-w',w+'px');document.documentElement.style.setProperty('--app-h',h+'px')}
syncViewport();window.addEventListener('resize',syncViewport);window.addEventListener('orientationchange',()=>setTimeout(syncViewport,60));window.addEventListener('pageshow',()=>{syncViewport();setTimeout(syncViewport,120)});window.visualViewport?.addEventListener('resize',syncViewport);
function load(){try{return JSON.parse(localStorage.getItem('edh-life'))}catch{return null}}
function save(){localStorage.setItem('edh-life',JSON.stringify({...S,hist:S.hist.slice(-40)}))}
function snap(){return JSON.stringify({count:S.count,players:S.players})}
function push(){S.hist.push(snap());if(S.hist.length>40)S.hist.shift()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dead(p,i){if(p.life<=0)return'ライフ0以下';for(let j=0;j<S.count;j++)if(i!==j&&(p.cmd[j]||0)>=21)return'統率者ダメージ21+';return''}
function cards(i){let a=[];for(let j=0;j<S.count;j++){if(i===j)continue;let v=S.players[i].cmd[j]||0;a.push(`<div class="cc ${v>=18?'hot':''}" style="--c:${S.players[j].color}"><div class="cw">${esc(S.players[j].name)}</div><div class="cv">${v}</div><div class="cb"><button data-cmd="-1" data-t="${i}" data-s="${j}">−1</button><button data-cmd="1" data-t="${i}" data-s="${j}">＋1</button></div></div>`)}return a.join('')}
function render(){let app=$('#app');app.className='c'+S.count;app.innerHTML='';S.players.forEach((p,i)=>{let e=document.createElement('section');e.className='p'+(i>=S.count?' hide':'');e.style.setProperty('--pc',p.color);let d=dead(p,i);e.innerHTML=`<div class="pc"><div class="name">${esc(p.name)}</div><div class="lifeRow"><button class="delta" data-life="${i}" data-d="-1">−</button><button class="life" data-life="${i}" data-d="0">${p.life}</button><button class="delta" data-life="${i}" data-d="1">＋</button></div><div class="q"><button data-life="${i}" data-d="-10">−10</button><button data-life="${i}" data-d="-5">−5</button><button data-life="${i}" data-d="5">＋5</button><button data-life="${i}" data-d="10">＋10</button></div><div class="cmd"><div class="ct">COMMANDER DAMAGE</div><div class="cg">${cards(i)}</div></div><div class="dead">${d}</div></div>`;app.appendChild(e)});bind();renderSettings()}
function bind(){$$('[data-life]').forEach(b=>b.onclick=()=>{let i=+b.dataset.life,d=+b.dataset.d;if(!d){let v=prompt(`${S.players[i].name} のライフ`,S.players[i].life);if(v===null||Number.isNaN(+v))return;push();S.players[i].life=parseInt(v,10)}else{push();S.players[i].life+=d}save();render()});$$('[data-cmd]').forEach(b=>b.onclick=()=>{let t=+b.dataset.t,s=+b.dataset.s,d=+b.dataset.cmd,c=S.players[t].cmd[s]||0,n=Math.max(0,c+d),a=n-c;if(!a)return;push();S.players[t].cmd[s]=n;S.players[t].life-=a;save();render()})}
function renderSettings(){let x=$('#ps');x.innerHTML='';S.players.forEach((p,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<b>Player ${i+1}</b><div style="display:flex;gap:8px"><input type="text" data-n="${i}" value="${esc(p.name)}"><input type="color" data-c="${i}" value="${p.color}"></div>`;x.appendChild(r)});$$('[data-n]').forEach(x=>x.onchange=()=>{if(!x.value.trim())return;push();S.players[+x.dataset.n].name=x.value.trim();save();render()});$$('[data-c]').forEach(x=>x.onchange=()=>{push();S.players[+x.dataset.c].color=x.value;save();render()})}
$$('[data-count]').forEach(b=>b.onclick=()=>{let n=+b.dataset.count;if(n===S.count)return;push();S.count=n;save();render()});
$('#undo').onclick=()=>{let p=S.hist.pop();if(!p)return;let x=JSON.parse(p);S.count=x.count;S.players=x.players;save();render()};
$('#set').onclick=()=>$('#settings').classList.add('show');$('#close').onclick=()=>$('#settings').classList.remove('show');$('#settings').onclick=e=>{if(e.target.id==='settings')e.currentTarget.classList.remove('show')};
let armed=false,rt;$('#reset').onclick=()=>{if(!armed){armed=true;$('#reset').textContent='もう一度押してリセット';clearTimeout(rt);rt=setTimeout(()=>{armed=false;$('#reset').textContent='全リセット'},2500);return}armed=false;clearTimeout(rt);push();S.players.forEach(p=>{p.life=40;p.cmd=[0,0,0,0]});save();render();$('#settings').classList.remove('show')};
function d6(){if(window.crypto&&crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%6+1}return Math.floor(Math.random()*6)+1}
function face(v){return`<div class="face" data-v="${v}">${[1,2,3,4,5,6,7,8,9].map(n=>`<i class="pip p${n}"></i>`).join('')}</div>`}
function clearDice(){$$('.die').forEach(x=>x.remove())}
function path(d,big){let r=(a,z)=>Math.round(a+Math.random()*(z-a)),x=big?130:48,y=big?60:28;d.style.setProperty('--x0',r(-x,-x*.5)+'px');d.style.setProperty('--y0',r(-y,-y*.3)+'px');d.style.setProperty('--x1',r(x*.3,x)+'px');d.style.setProperty('--y1',r(-y,y*.1)+'px');d.style.setProperty('--x2',r(-x*.6,-8)+'px');d.style.setProperty('--y2',r(-4,y*.5)+'px');d.style.setProperty('--x3',r(6,x*.4)+'px');d.style.setProperty('--y3',r(-y*.3,8)+'px')}
function animate(d,final){d.classList.add('rolling');let last=0,n=0,t=setInterval(()=>{let v;do v=d6();while(v===last);last=v;d.innerHTML=face(v);if(++n>=10){clearInterval(t);setTimeout(()=>{d.innerHTML=face(final);d.classList.remove('rolling')},90)}},62)}
function mkDie(cls,final,big,host,delay=0,win=false){let d=document.createElement('div');d.className='die '+cls;path(d,big);d.innerHTML=face(d6());d.style.animationDelay=delay+'ms';host.appendChild(d);setTimeout(()=>{animate(d,final);if(win)setTimeout(()=>d.style.boxShadow='0 0 0 4px #ffcc66ad,0 18px 42px #0007',820)},delay)}
function one(){clearDice();mkDie('center',d6(),true,$('#dl'))}
function all(){clearDice();let ps=$$('#app .p:not(.hide)'),rs=ps.map(p=>({p,v:d6()})),hi=Math.max(...rs.map(r=>r.v));rs.forEach((r,i)=>mkDie('player',r.v,false,r.p,i*45,r.v===hi))}
const dm=$('#dm');$('#dice').onclick=e=>{e.stopPropagation();clearDice();dm.classList.toggle('show')};$('#one').onclick=e=>{e.stopPropagation();dm.classList.remove('show');one()};$('#all').onclick=e=>{e.stopPropagation();dm.classList.remove('show');all()};document.addEventListener('click',()=>{dm.classList.remove('show');clearDice()});
const fs=$('#fs');function full(){return document.fullscreenElement||document.webkitFullscreenElement}fs.onclick=async()=>{try{if(full())await(document.exitFullscreen?.()||document.webkitExitFullscreen?.());else await(document.documentElement.requestFullscreen?.()||document.documentElement.webkitRequestFullscreen?.())}catch{}};if(!document.documentElement.requestFullscreen&&!document.documentElement.webkitRequestFullscreen)fs.style.display='none';document.addEventListener('fullscreenchange',()=>fs.textContent=full()?'🗗':'⛶');
async function awake(){try{if('wakeLock'in navigator)window._wl=await navigator.wakeLock.request('screen')}catch{}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')awake()});awake();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
</html>
